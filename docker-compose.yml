version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eu-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE:-n8n}
      POSTGRES_USER: ${DB_POSTGRESDB_USER:-n8n_user}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-changeme}
      POSTGRES_NON_ROOT_USER: ${DB_POSTGRESDB_USER:-n8n_user}
      POSTGRES_NON_ROOT_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_POSTGRESDB_USER:-n8n_user} -d ${DB_POSTGRESDB_DATABASE:-n8n}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eu-ai-network

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: eu-ai-n8n
    restart: unless-stopped
    environment:
      # Basic Configuration
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}

      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-n8n_user}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-changeme}
      - DB_POSTGRESDB_SCHEMA=public

      # Security
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - N8N_JWT_SECRET=${N8N_JWT_SECRET:-your-jwt-secret}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-your-encryption-key}

      # Execution Configuration
      - EXECUTIONS_MODE=regular
      - N8N_CONCURRENCY=10
      - EXECUTIONS_TIMEOUT=3600
      - EXECUTIONS_TIMEOUT_MAX=7200

      # Logging
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=console

      # Performance
      - N8N_PAYLOAD_SIZE_MAX=16
      - N8N_WEBHOOK_WAIT_TIME=120000

      # Generic timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Brussels}

      # External API Keys (passed from .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AIRTABLE_API_KEY=${AIRTABLE_API_KEY}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflow-eu-ai-act-compliance.json:/home/node/.n8n/workflows/eu-ai-act-compliance.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eu-ai-network
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:5678/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: eu-ai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - n8n
    networks:
      - eu-ai-network
    profiles:
      - production

  # Redis (Optional - for caching and queue mode)
  redis:
    image: redis:7-alpine
    container_name: eu-ai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - eu-ai-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  eu-ai-network:
    driver: bridge
